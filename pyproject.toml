[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-infra-verifier"
version = "0.1.0"
description = "Resource and execution evidence for framework-independent agent experiments"
requires-python = ">=3.11"
dependencies = ["psutil>=7.0,<8"]

[project.scripts]
infra-verify = "infra_verifier.cli:main"

[tool.setuptools.packages.find]
include = ["infra_verifier*"]

[project.optional-dependencies]
dev = ["ruff==0.17.5"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["vendor", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
